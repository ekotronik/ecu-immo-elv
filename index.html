<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>EKOTRONIK</title>
<style>
body {background:#0b1220;color:#fff;font-family:Arial;}
.section{padding:40px;}
.projekty-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;}
.projekt-card{background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:20px;text-align:center;}
button{background:#22c55e;border:none;padding:10px;border-radius:8px;cursor:pointer;}
</style>
<script>
function openGallery(cat){alert("Galeria: "+cat);}
</script>
</head>
<body>

<section class="section">
<h2>Projekty rozwojowe</h2>
<p>Moje projekty i rozwój systemów</p>

<div class="projekty-grid">
<div class="projekt-card"><h3>Tester prądu</h3><button onclick="openGallery('tester')">Podgląd</button></div>
<div class="projekt-card"><h3>ECU Tester PRO</h3><button onclick="openGallery('ecu_tool')">Podgląd</button></div>
<div class="projekt-card"><h3>Analizator ładowania</h3><button onclick="openGallery('charging')">Podgląd</button></div>
<div class="projekt-card"><h3>Symulator</h3><button onclick="openGallery('symulator')">Podgląd</button></div>
</div>

</section>

</body>
</html>
