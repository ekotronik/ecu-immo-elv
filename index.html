<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>EKOTRONIK PRO+</title>
<style>
body{margin:0;background:#0b1220;color:#fff;font-family:Arial;}
.section{padding:60px;text-align:center;}
h2{font-size:32px;margin-bottom:10px;}
p{color:#94a3b8;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
margin-top:40px;
}

.card{
background:#0f172a;
border:1px solid #1e293b;
border-radius:16px;
padding:25px;
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

.status{
display:inline-block;
padding:4px 10px;
border-radius:6px;
font-size:12px;
margin-bottom:10px;
}

.build{background:#f59e0b;color:#000;}
.ready{background:#22c55e;color:#000;}

button{
margin-top:10px;
padding:10px 15px;
border:none;
border-radius:8px;
background:#22c55e;
color:#000;
font-weight:bold;
cursor:pointer;
}
</style>

<script>
function openGallery(cat){
alert("Galeria projektu: "+cat);
}
</script>
</head>

<body>

<section class="section">
<h2>Projekty rozwojowe</h2>
<p>Moje autorskie projekty diagnostyczne i systemy ECU</p>

<div class="grid">

<div class="card">
<span class="status build">W TRAKCIE</span>
<h3>Tester prądu PRO</h3>
<button onclick="openGallery('tester')">Podgląd</button>
</div>

<div class="card">
<span class="status build">PROTOTYP</span>
<h3>ECU Tester PRO</h3>
<button onclick="openGallery('ecu_tool')">Podgląd</button>
</div>

<div class="card">
<span class="status build">ROZWÓJ</span>
<h3>Analizator ładowania</h3>
<button onclick="openGallery('charging')">Podgląd</button>
</div>

<div class="card">
<span class="status ready">GOTOWY</span>
<h3>Symulator instalacji</h3>
<button onclick="openGallery('symulator')">Podgląd</button>
</div>

</div>
</section>

</body>
</html>
